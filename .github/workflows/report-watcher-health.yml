# ReportWatcher Health Check
#
# Polls staging and production ReportWatcher Durable Objects every 15 min and,
# on repeated failure, notifies two ways (matching the sibling
# minor-review-endpoint-health workflow): it fails the run so GitHub emails
# the user who last modified this workflow's cron schedule (GitHub's rule for
# scheduled-workflow failures), and it posts to #divine-alerts via Slack (same channel as GKE
# alerting). Its job is reliable detection, diagnosis, and alerting.
#
# A deliberate stop sticks. /stop (the engineer's way to halt report intake and
# auto-hide; the DO's alarm still runs sexual-quarantine case recovery while
# stopped) makes the DO record deliberatelyStoppedAt (epoch milliseconds) in its
# status. When that is set and running is false, this workflow does
# not POST /start and does not count the check as a failure; the run only logs a
# ::notice:: with the environment and stop time (UTC), except for the email
# reminders described next. It stays that way until someone POSTs /start, which
# clears the marker. A watcher that is not running
# with no marker (never started) is still treated as unhealthy, and a status
# without the field (older worker) counts as not deliberately stopped.
#
# In production only, a forgotten stop is surfaced by email, not Slack: the run
# goes red (GitHub emails the person who last edited this workflow's schedule,
# per GitHub's scheduled-workflow notification rule;
# wider routing is a separate follow-up) the first time a given
# stop is seen, identified by its
# deliberatelyStoppedAt value, and again once every 24 h while that same stop
# persists. Every other run during the stop passes with the ::notice::. The
# state is one repo variable (RW_STOP_ALERTED_PRODUCTION,
# "<stoppedAtMs>:<alertedAtMs>", same PAT as RW_FAILS_*), superseded by a new stop and deleted once the watcher is seen
# running. Staging never fails the run or writes a reminder variable over a
# deliberate stop; it only emits the ::notice::. A stop never counts toward the
# consecutive-failure Slack alert.
#
# Recovery is best-effort only. On an unhealthy check it POSTs /start, but the
# DO's /start is a no-op when it already believes it is running (the common
# "running:true, connected:false" case, e.g. a dropped relay socket), and the
# DO already self-heals via its own alarm-driven reconnect. So treat any
# recovery inside the re-check window as the DO healing itself, not this
# workflow, and rely on this workflow to alert a human when it does not.
#
# Alerting limits:
#   - Scheduled workflows in public repositories are automatically disabled
#     after 60 days without repository activity. Re-enable this workflow from
#     the Actions tab if the repository goes dormant.
#   - Schedules only run from the default branch, so this monitor goes live
#     after merge rather than on the pull request.
#
# Lives in relay-manager (not iac-coreconfig) because ReportWatcher is a
# Cloudflare Durable Object outside the GKE observability perimeter.
# No Prometheus, no VMRule, no liveness probe can reach it.
#
# Failure counting uses GitHub Actions repository variables
# (RW_FAILS_STAGING, RW_FAILS_PRODUCTION) instead of actions/cache.
# These are simple integers that persist across runs without accumulating
# cache entries. The workflow resets them to 0 on recovery.
#
# Staging runs only when needed, so its relay is down most of the time and
# ReportWatcher there can never connect. Before checking staging, the workflow
# asks the staging relay for its NIP-11 document. If the relay does not answer
# 200, the check is skipped: the run stays green, logs a notice, and resets
# RW_FAILS_STAGING to 0 so that staging coming back does not alert on a count
# left over from the downtime. When the relay answers again, checks resume on
# their own (the DO retries its connection at least once a minute). The costs:
# an unplanned staging relay outage alerts nobody, and a staging relay that
# flaps between up and down resets the count on every down run, so a broken
# staging ReportWatcher may never reach the alert threshold. Production has no
# such skip; a production relay outage still alerts.
#
# Setup:
#   1. Repo secrets (Settings > Secrets and variables > Actions):
#      - CF_ACCESS_CLIENT_ID     -- Cloudflare Access service token
#      - CF_ACCESS_CLIENT_SECRET -- Cloudflare Access service token
#      - SLACK_WEBHOOK_ALERTS    -- Incoming webhook for #divine-alerts
#        (same value as vmalertmanager-slack-webhook-{env} in GCP Secret Manager)
#      - RW_HEALTH_VARS_TOKEN    -- fine-grained PAT with this repo's
#        "Variables: Read and write" permission. Required for failure-count
#        persistence: the default GITHUB_TOKEN CANNOT manage Actions variables,
#        so without this PAT the consecutive-failure count never persists and
#        alerts never fire. If the secret is absent the workflow still runs and
#        reports health, but skips persistence and suppresses alerting.
#   2. Repo variables (Settings > Secrets and variables > Actions > Variables):
#      - RW_FAILS_STAGING        -- created automatically on first run
#      - RW_FAILS_PRODUCTION     -- created automatically on first run
#      - RW_STOP_ALERTED_PRODUCTION -- deliberate-stop reminder state, created
#        on the first stop and deleted when it ends (production only)
#   3. To test manually: Actions tab > "ReportWatcher Health Check" > Run workflow

name: ReportWatcher Health Check

on:
  schedule:
    # Every 15 min, offset off the quarter-hour (and off the sibling
    # minor-review check's 7,22,37,52) to avoid runner contention.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

# The default GITHUB_TOKEN needs no write access here: health/restart use CF
# Access, alerting uses a Slack webhook, and variable persistence uses the
# dedicated RW_HEALTH_VARS_TOKEN PAT (see header). Keep the token least-privilege.
permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Serialize per environment so a slow run cannot read-modify-write the same
    # RW_FAILS_* variable as the next scheduled run. Queue rather than cancel;
    # never abandon an in-flight health check.
    concurrency:
      group: report-watcher-health-${{ matrix.env.name }}
      cancel-in-progress: false

    strategy:
      # A failing env must not cancel the other env's health check.
      fail-fast: false
      matrix:
        env:
          - name: staging
            url: https://api-relay-staging.divine.video
            fails_var: RW_FAILS_STAGING
            # The relay ReportWatcher connects to (RELAY_URL in
            # worker/wrangler.staging.toml), over HTTPS for NIP-11. Set only
            # on staging: see the header for why.
            relay_probe_url: https://relay.staging.divine.video
          - name: production
            url: https://api-relay-prod.divine.video
            fails_var: RW_FAILS_PRODUCTION
            stop_var: RW_STOP_ALERTED_PRODUCTION

    steps:
      - name: Check the relay is up
        id: relay
        if: matrix.env.relay_probe_url != ''
        env:
          RELAY_HTTP_URL: ${{ matrix.env.relay_probe_url }}
        run: |
          # curl retries timeouts and 408/429/500/502/503/504, so one such blip
          # does not skip a check. Connection refused is not retried.
          RELAY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            --retry 2 --retry-delay 5 \
            -H 'Accept: application/nostr+json' \
            "$RELAY_HTTP_URL/" 2>/dev/null) || RELAY_CODE="${RELAY_CODE:-000}"
          if [ "$RELAY_CODE" = "200" ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.env.name }} relay $RELAY_HTTP_URL is down (HTTP $RELAY_CODE); skipping the ReportWatcher check until it is back"
          fi

      - name: Check health
        id: check
        if: steps.relay.outputs.skipped != 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          API_URL: ${{ matrix.env.url }}
        run: |
          # Capture HTTP status and body separately for diagnostics (#130)
          HTTP_CODE=$(curl -sS -o /tmp/rw-response.json -w '%{http_code}' --max-time 10 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$API_URL/api/report-watcher/status" 2>/tmp/rw-curl-err.txt) || {
            CURL_EXIT=$?
            CURL_ERR=$(cat /tmp/rw-curl-err.txt 2>/dev/null | tail -1)
            # Distinguish transport failures from HTTP errors
            if [ "$CURL_EXIT" = "28" ]; then
              DIAG="timeout after 10s"
            elif [ "$CURL_EXIT" = "6" ]; then
              DIAG="DNS resolution failed"
            elif [ "$CURL_EXIT" = "7" ]; then
              DIAG="connection refused"
            else
              DIAG="curl exit $CURL_EXIT: $CURL_ERR"
            fi
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=transport_error: $DIAG" >> "$GITHUB_OUTPUT"
            echo "http_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          # CF Access redirects browser-style unauthenticated requests to its
          # login page. Missing, invalid, expired, or unauthorized service
          # tokens therefore return 302 on these hosts rather than reaching
          # the worker's own 401/403 admin-auth response.
          if [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=auth_error: HTTP $HTTP_CODE (check CF Access credentials)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=http_error: HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(cat /tmp/rw-response.json)
          CONNECTED=$(echo "$BODY" | jq -r '.status.connected' 2>/dev/null) || {
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=parse_error: response is not valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          }
          RUNNING=$(echo "$BODY" | jq -r '.status.running' 2>/dev/null) || {
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=parse_error: .status.running not readable" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A deliberate /stop halts report intake and auto-hide, so it is not a
          # failure and must not be undone by the /start nudge. The DO records the
          # stop time in epoch milliseconds; a missing or non-numeric field (older
          # worker) means "not deliberately stopped". Only running exactly false
          # counts: null or missing running stays unhealthy.
          STOPPED_AT=$(echo "$BODY" | jq -r 'if (.status.deliberatelyStoppedAt | type) == "number" then (.status.deliberatelyStoppedAt / 1000 | floor | todate) else empty end' 2>/dev/null) || STOPPED_AT=""
          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"
          if [ "$RUNNING" = "false" ] && [ -n "$STOPPED_AT" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "stopped_at_ms=$(echo "$BODY" | jq -r '.status.deliberatelyStoppedAt | floor')" >> "$GITHUB_OUTPUT"
            echo "stopped_at_utc=$STOPPED_AT" >> "$GITHUB_OUTPUT"
            echo "::notice::ReportWatcher ${{ matrix.env.name }} was deliberately stopped at $STOPPED_AT; not restarting and not counting it as a failure. POST /api/report-watcher/start to resume."
          elif [ "$CONNECTED" = "true" ] && [ "$RUNNING" = "true" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "payload=$(echo "$BODY" | jq -c '.status')" >> "$GITHUB_OUTPUT"

      # --- Remind people about a deliberate stop (fails the run, no Slack) ---
      # A deliberate stop is not a failure and never feeds the consecutive-failure
      # Slack alert, but a forgotten one leaves auto-hiding and automatic age-review intake off. So the
      # run is made red (GitHub emails the person who last edited the schedule) the first time a given stop
      # (identified by its deliberatelyStoppedAt value) is seen, and again once
      # every 24 h while that same stop persists. Other runs just log the notice.
      # State is one repo variable per environment holding
      # "<stoppedAtMs>:<alertedAtMs>". A new stop value supersedes it, and the
      # variable is deleted once a check sees the watcher running again. Without
      # RW_HEALTH_VARS_TOKEN nothing can be tracked, so the reminder is skipped
      # (emailing every 15 min would be noise).

      - name: Track deliberate stop reminder
        id: stop
        if: always() && matrix.env.stop_var != '' && steps.check.outputs.running != ''
        # Reminder bookkeeping must never block the restart nudge or the failure
        # counting for a real outage. Kept in place (rather than moved after
        # "Update failure count") so the decision sits next to the check it reads.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RW_HEALTH_VARS_TOKEN }}
          STOP_VAR: ${{ matrix.env.stop_var }}
          RUNNING: ${{ steps.check.outputs.running }}
          STOPPED_AT_MS: ${{ steps.check.outputs.stopped_at_ms }}
          STOPPED_AT_UTC: ${{ steps.check.outputs.stopped_at_utc }}
        run: |
          ALERT=false
          trap 'echo "alert=$ALERT" >> "$GITHUB_OUTPUT"' EXIT
          if [ -z "$GH_TOKEN" ]; then
            [ -n "$STOPPED_AT_MS" ] && echo "::warning::RW_HEALTH_VARS_TOKEN not configured; cannot track the deliberate-stop reminder"
            exit 0
          fi
          # Only "not found" means "no record yet" (gh 2.105 prints exactly
          # "variable <NAME> was not found"). Any other failure (rate limit, 5xx,
          # expired token) would look like first sight and send an early reminder
          # that resets the 24 h clock, so skip the decision this run instead.
          if STORED=$(gh variable get "$STOP_VAR" --repo "$GITHUB_REPOSITORY" 2>/tmp/rw-stop-err.txt); then
            :
          elif grep -qF "variable $STOP_VAR was not found" /tmp/rw-stop-err.txt; then
            STORED=""
          else
            echo "::warning::could not read $STOP_VAR ($(tail -1 /tmp/rw-stop-err.txt)); skipping the deliberate-stop reminder this run"
            exit 0
          fi

          if [ -z "$STOPPED_AT_MS" ]; then
            # Only a watcher seen running clears the record; a blip or a
            # never-started watcher must not re-arm the reminder.
            if [ "$RUNNING" = "true" ] && [ -n "$STORED" ]; then
              gh variable delete "$STOP_VAR" --repo "$GITHUB_REPOSITORY" || echo "::warning::failed to clear $STOP_VAR"
            fi
            exit 0
          fi

          NOW_MS=$(( $(date +%s) * 1000 ))
          LAST_STOP="${STORED%%:*}"
          LAST_ALERT="${STORED##*:}"
          [[ "$LAST_ALERT" =~ ^[0-9]+$ ]] || LAST_ALERT=0
          if [ "$LAST_STOP" = "$STOPPED_AT_MS" ] && [ $(( NOW_MS - LAST_ALERT )) -lt 86400000 ]; then
            exit 0
          fi
          if ! gh variable set "$STOP_VAR" --repo "$GITHUB_REPOSITORY" --body "$STOPPED_AT_MS:$NOW_MS"; then
            echo "::warning::failed to persist $STOP_VAR (check RW_HEALTH_VARS_TOKEN has Variables: read/write); the reminder may repeat every run"
          fi
          ALERT=true

      # --- Best-effort restart nudge before alerting ---
      # POSTs /start, but the DO's /start is a no-op when it already believes it
      # is running, which is the common unhealthy state. Any recovery seen in the
      # re-check window is usually the DO's own alarm reconnect. Kept because it
      # is harmless and occasionally helps (a watcher that is down but was not deliberately stopped); the
      # real value of this step is the post-nudge re-check that decides alerting.

      - name: Best-effort restart nudge
        id: recover
        if: steps.check.outputs.healthy == 'false' && steps.check.outputs.http_code != '302' && steps.check.outputs.http_code != '401' && steps.check.outputs.http_code != '403'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          API_URL: ${{ matrix.env.url }}
          INITIAL_FAILURE: ${{ steps.check.outputs.payload }}
        run: |
          echo "ReportWatcher unhealthy on ${{ matrix.env.name }}; sending best-effort /start (no-op if already running) and re-checking..."
          echo "Initial failure: $INITIAL_FAILURE"

          RESTART_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$API_URL/api/report-watcher/start" 2>/dev/null) || RESTART_CODE="transport_error"
          echo "Restart response: $RESTART_CODE"

          echo "Waiting 30s for reconnection..."
          sleep 30

          HTTP_CODE=$(curl -s -o /tmp/rw-recover.json -w '%{http_code}' --max-time 10 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$API_URL/api/report-watcher/status" 2>/dev/null) || {
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "payload=transport_error after restart" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$HTTP_CODE" != "200" ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "payload=http_error after restart: HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(cat /tmp/rw-recover.json)
          CONNECTED=$(echo "$BODY" | jq -r '.status.connected' 2>/dev/null)
          RUNNING=$(echo "$BODY" | jq -r '.status.running' 2>/dev/null)
          if [ "$CONNECTED" = "true" ] && [ "$RUNNING" = "true" ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            echo "ReportWatcher recovered after restart"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "payload=$(echo "$BODY" | jq -c '.status')" >> "$GITHUB_OUTPUT"
            echo "ReportWatcher still unhealthy after restart"
          fi

      # --- Failure counting via repo variables (not cache) ---
      # Uses GitHub Actions repository variables for persistence.
      # Simple, no cache accumulation, easy to inspect and reset manually.

      - name: Update failure count
        id: counts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RW_HEALTH_VARS_TOKEN }}
          HEALTHY: ${{ steps.check.outputs.healthy }}
          RECOVERED: ${{ steps.recover.outputs.recovered }}
          SKIPPED: ${{ steps.relay.outputs.skipped }}
          FAILS_VAR: ${{ matrix.env.fails_var }}
        run: |
          # Consecutive-failure persistence uses a repo variable, which the
          # default GITHUB_TOKEN cannot write -- hence the dedicated PAT. If the
          # PAT is absent, degrade gracefully: report this run's health but skip
          # persistence and suppress alerting (consecutive runs cannot be counted
          # without it, and a single-run alert would be noise).
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RW_HEALTH_VARS_TOKEN not configured; skipping failure-count persistence and alerting"
            echo "fails=0" >> "$GITHUB_OUTPUT"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            if [ "$HEALTHY" = "false" ] && [ "$RECOVERED" = "true" ]; then
              echo "self_healed=true" >> "$GITHUB_OUTPUT"
            else
              echo "self_healed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Read current count from repo variable (default 0 if not set)
          FAILS=$(gh variable get "$FAILS_VAR" --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "0")
          [[ "$FAILS" =~ ^[0-9]+$ ]] || FAILS=0

          # A skipped check (relay down, see header) restarts the count, so
          # the relay coming back does not alert on failures from the downtime.
          if [ "$SKIPPED" = "true" ] || [ "$HEALTHY" = "true" ] || [ "$RECOVERED" = "true" ]; then
            FAILS=0
          else
            FAILS=$((FAILS + 1))
          fi

          # Write back. A configured-but-failing PAT (expired or under-scoped) is
          # worse than an absent one: the count would silently reset every run and
          # never reach the alert threshold, so the monitor would sit broken and
          # quiet. Flag it (persist_broken) so the next step alerts on the
          # monitor's OWN failure. (The absent-PAT case above stays quiet: that is
          # the not-yet-enabled state, not a breakage.)
          # Retry a few times so a transient GitHub API blip (5xx, secondary
          # rate limit) does not page us. Only a persistent write failure --
          # an expired or under-scoped PAT -- trips persist_broken.
          SET_OK=false
          for _ in 1 2 3; do
            if gh variable set "$FAILS_VAR" --repo "$GITHUB_REPOSITORY" --body "$FAILS"; then
              SET_OK=true
              break
            fi
            sleep 5
          done
          if [ "$SET_OK" != "true" ]; then
            echo "::warning::failed to persist $FAILS_VAR after retries (check RW_HEALTH_VARS_TOKEN has Variables: read/write)"
            echo "persist_broken=true" >> "$GITHUB_OUTPUT"
          fi

          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"

          if [ "$FAILS" -ge 2 ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$HEALTHY" = "false" ] && [ "$RECOVERED" = "true" ]; then
            echo "self_healed=true" >> "$GITHUB_OUTPUT"
          else
            echo "self_healed=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Alert to Slack when a check is unhealthy on 2+ consecutive runs ---
      # always() so a failure in another notification step cannot suppress it.

      - name: Alert to Slack
        if: always() && steps.counts.outputs.alert == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          ENV_NAME: ${{ matrix.env.name }}
          FAILS: ${{ steps.counts.outputs.fails }}
          STATUS_PAYLOAD: ${{ steps.recover.outputs.payload || steps.check.outputs.payload }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_ALERTS secret not configured, skipping alert"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$ENV_NAME" \
            --arg fails "$FAILS" \
            --arg status "$STATUS_PAYLOAD" \
            --arg run_url "$RUN_URL" \
            '{
              text: ":rotating_light: ReportWatcher *\($env)* unhealthy on \($fails) consecutive checks (a restart nudge did not bring it back)",
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ":rotating_light: *ReportWatcher health check failing*\n*Environment:* \($env)\n*Consecutive failed checks:* \($fails) (counting the post-nudge re-checks)\n*Status:* `\($status)`"}},
                {type: "context", elements: [{type: "mrkdwn", text: "<\($run_url)|View workflow run>"}]}
              ]
            }')
          curl -sf --max-time 10 -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "::warning::Slack post failed; the red run still notifies"

      # --- Alert when the monitor itself cannot persist state (fail loud) ---
      # A configured-but-failing PAT would otherwise leave the check silently
      # unable to count failures, so the monitor could sit broken and quiet.
      # A health check that cannot report its own breakage is worse than none.

      - name: Alert monitor failure
        if: always() && steps.counts.outputs.persist_broken == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          ENV_NAME: ${{ matrix.env.name }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_ALERTS not configured; cannot alert on monitor failure"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$ENV_NAME" \
            --arg run_url "$RUN_URL" \
            '{
              text: ":warning: ReportWatcher health monitor is broken for *\($env)* (cannot persist failure count)",
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ":warning: *ReportWatcher health monitor cannot persist state*\n*Environment:* \($env)\nRW_HEALTH_VARS_TOKEN is missing, expired, or lacks Variables: read/write, so consecutive failures cannot be counted and outage alerts will not fire. *ReportWatcher \($env) is effectively unmonitored until this is fixed.*"}},
                {type: "context", elements: [{type: "mrkdwn", text: "<\($run_url)|View workflow run>"}]}
              ]
            }')
          curl -sf --max-time 10 -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "::warning::Slack post failed; the red run still notifies"

      # --- Quiet log when self-healing worked (no alert, just visibility) ---

      - name: Log recovery
        if: always() && steps.counts.outputs.self_healed == 'true'
        run: |
          echo "::notice::ReportWatcher ${{ matrix.env.name }} was unhealthy but recovered on re-check (best-effort /start nudge or the DO's own reconnect)"

      # --- Fail the run so GitHub emails about a deliberate stop ---
      # Red only for the first sight of a stop and once per 24 h after (see the
      # "Track deliberate stop reminder" step). Not counted toward the Slack alert.
      - name: Fail the run to remind about a deliberate stop
        if: always() && steps.stop.outputs.alert == 'true'
        env:
          ENV_NAME: ${{ matrix.env.name }}
          STOPPED_AT_UTC: ${{ steps.check.outputs.stopped_at_utc }}
        run: |
          MSG="ReportWatcher on $ENV_NAME has been deliberately stopped since $STOPPED_AT_UTC. Auto-hiding and automatic age-review intake are off until someone POSTs /api/report-watcher/start."
          echo "::error::$MSG"
          {
            echo "### ReportWatcher deliberately stopped ($ENV_NAME)"
            echo "$MSG"
            echo
            echo "This run is red only to remind you: on the first check that sees this stop and once every 24 hours after. It is not counted as a failure for the Slack alert."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # --- Fail the run so GitHub notifies, matching the sibling health check ---
      # Red on the same condition as the Slack alert: a repeated outage (>=2
      # consecutive) or the monitor's own persistence being broken. Not on a
      # single transient blip, so there is no email on noise.
      - name: Fail the run so GitHub notifies
        if: always() && (steps.counts.outputs.alert == 'true' || steps.counts.outputs.persist_broken == 'true')
        run: exit 1
