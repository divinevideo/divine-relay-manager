# ReportWatcher Health Check
#
# Polls staging and production ReportWatcher Durable Objects every 15 min and,
# on repeated failure, alerts #divine-alerts via Slack (same channel as GKE
# alerting). Its job is reliable detection, diagnosis, and alerting.
#
# Recovery is best-effort only. On an unhealthy check it POSTs /start, but the
# DO's /start is a no-op when it already believes it is running (the common
# "running:true, connected:false" case, e.g. a dropped relay socket), and the
# DO already self-heals via its own alarm-driven reconnect. So treat any
# recovery inside the re-check window as the DO healing itself, not this
# workflow, and rely on this workflow to alert a human when it does not.
#
# Lives in relay-manager (not iac-coreconfig) because ReportWatcher is a
# Cloudflare Durable Object outside the GKE observability perimeter.
# No Prometheus, no VMRule, no liveness probe can reach it.
#
# Failure counting uses GitHub Actions repository variables
# (RW_FAILS_STAGING, RW_FAILS_PRODUCTION) instead of actions/cache.
# These are simple integers that persist across runs without accumulating
# cache entries. The workflow resets them to 0 on recovery.
#
# Setup:
#   1. Repo secrets (Settings > Secrets and variables > Actions):
#      - CF_ACCESS_CLIENT_ID     -- Cloudflare Access service token
#      - CF_ACCESS_CLIENT_SECRET -- Cloudflare Access service token
#      - SLACK_WEBHOOK_ALERTS    -- Incoming webhook for #divine-alerts
#        (same value as vmalertmanager-slack-webhook-{env} in GCP Secret Manager)
#      - RW_HEALTH_VARS_TOKEN    -- fine-grained PAT with this repo's
#        "Variables: Read and write" permission. Required for failure-count
#        persistence: the default GITHUB_TOKEN CANNOT manage Actions variables,
#        so without this PAT the consecutive-failure count never persists and
#        alerts never fire. If the secret is absent the workflow still runs and
#        reports health, but skips persistence and suppresses alerting.
#   2. Repo variables (Settings > Secrets and variables > Actions > Variables):
#      - RW_FAILS_STAGING        -- created automatically on first run
#      - RW_FAILS_PRODUCTION     -- created automatically on first run
#   3. To test manually: Actions tab > "ReportWatcher Health Check" > Run workflow

name: ReportWatcher Health Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# The default GITHUB_TOKEN needs no write access here: health/restart use CF
# Access, alerting uses a Slack webhook, and variable persistence uses the
# dedicated RW_HEALTH_VARS_TOKEN PAT (see header). Keep the token least-privilege.
permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    # Never mark the workflow as failed -- that emails all repo watchers.
    # Alerting goes through Slack only.
    continue-on-error: true

    # Serialize per environment so a slow run cannot read-modify-write the same
    # RW_FAILS_* variable as the next scheduled run. Queue rather than cancel;
    # never abandon an in-flight health check.
    concurrency:
      group: report-watcher-health-${{ matrix.env.name }}
      cancel-in-progress: false

    strategy:
      matrix:
        env:
          - name: staging
            url: https://api-relay-staging.divine.video
            fails_var: RW_FAILS_STAGING
          - name: production
            url: https://api-relay-prod.divine.video
            fails_var: RW_FAILS_PRODUCTION

    steps:
      - name: Check health
        id: check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          API_URL: ${{ matrix.env.url }}
        run: |
          # Capture HTTP status and body separately for diagnostics (#130)
          HTTP_CODE=$(curl -s -o /tmp/rw-response.json -w '%{http_code}' --max-time 10 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$API_URL/api/report-watcher/status" 2>/tmp/rw-curl-err.txt) || {
            CURL_EXIT=$?
            CURL_ERR=$(cat /tmp/rw-curl-err.txt 2>/dev/null | tail -1)
            # Distinguish transport failures from HTTP errors
            if [ "$CURL_EXIT" = "28" ]; then
              DIAG="timeout after 10s"
            elif [ "$CURL_EXIT" = "6" ]; then
              DIAG="DNS resolution failed"
            elif [ "$CURL_EXIT" = "7" ]; then
              DIAG="connection refused"
            else
              DIAG="curl exit $CURL_EXIT: $CURL_ERR"
            fi
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=transport_error: $DIAG" >> "$GITHUB_OUTPUT"
            echo "http_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=auth_error: HTTP $HTTP_CODE (check CF Access credentials)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=http_error: HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(cat /tmp/rw-response.json)
          CONNECTED=$(echo "$BODY" | jq -r '.status.connected' 2>/dev/null) || {
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=parse_error: response is not valid JSON" >> "$GITHUB_OUTPUT"
            exit 0
          }
          RUNNING=$(echo "$BODY" | jq -r '.status.running' 2>/dev/null) || {
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "payload=parse_error: .status.running not readable" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$CONNECTED" = "true" ] && [ "$RUNNING" = "true" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "payload=$(echo "$BODY" | jq -c '.status')" >> "$GITHUB_OUTPUT"

      # --- Best-effort restart nudge before alerting ---
      # POSTs /start, but the DO's /start is a no-op when it already believes it
      # is running, which is the common unhealthy state. Any recovery seen in the
      # re-check window is usually the DO's own alarm reconnect. Kept because it
      # is harmless and occasionally helps (a genuinely stopped watcher); the
      # real value of this step is the post-nudge re-check that decides alerting.

      - name: Best-effort restart nudge
        id: recover
        if: steps.check.outputs.healthy == 'false' && steps.check.outputs.http_code != '401' && steps.check.outputs.http_code != '403'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          API_URL: ${{ matrix.env.url }}
        run: |
          echo "ReportWatcher unhealthy on ${{ matrix.env.name }}; sending best-effort /start (no-op if already running) and re-checking..."
          echo "Initial failure: ${{ steps.check.outputs.payload }}"

          RESTART_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$API_URL/api/report-watcher/start" 2>/dev/null) || RESTART_CODE="transport_error"
          echo "Restart response: $RESTART_CODE"

          echo "Waiting 30s for reconnection..."
          sleep 30

          HTTP_CODE=$(curl -s -o /tmp/rw-recover.json -w '%{http_code}' --max-time 10 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$API_URL/api/report-watcher/status" 2>/dev/null) || {
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "payload=transport_error after restart" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$HTTP_CODE" != "200" ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "payload=http_error after restart: HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(cat /tmp/rw-recover.json)
          CONNECTED=$(echo "$BODY" | jq -r '.status.connected' 2>/dev/null)
          RUNNING=$(echo "$BODY" | jq -r '.status.running' 2>/dev/null)
          if [ "$CONNECTED" = "true" ] && [ "$RUNNING" = "true" ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            echo "ReportWatcher recovered after restart"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            echo "payload=$(echo "$BODY" | jq -c '.status')" >> "$GITHUB_OUTPUT"
            echo "ReportWatcher still unhealthy after restart"
          fi

      # --- Failure counting via repo variables (not cache) ---
      # Uses GitHub Actions repository variables for persistence.
      # Simple, no cache accumulation, easy to inspect and reset manually.

      - name: Update failure count
        id: counts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RW_HEALTH_VARS_TOKEN }}
          HEALTHY: ${{ steps.check.outputs.healthy }}
          RECOVERED: ${{ steps.recover.outputs.recovered }}
          FAILS_VAR: ${{ matrix.env.fails_var }}
        run: |
          # Consecutive-failure persistence uses a repo variable, which the
          # default GITHUB_TOKEN cannot write -- hence the dedicated PAT. If the
          # PAT is absent, degrade gracefully: report this run's health but skip
          # persistence and suppress alerting (consecutive runs cannot be counted
          # without it, and a single-run alert would be noise).
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RW_HEALTH_VARS_TOKEN not configured; skipping failure-count persistence and alerting"
            echo "fails=0" >> "$GITHUB_OUTPUT"
            echo "alert=false" >> "$GITHUB_OUTPUT"
            if [ "$HEALTHY" = "false" ] && [ "$RECOVERED" = "true" ]; then
              echo "self_healed=true" >> "$GITHUB_OUTPUT"
            else
              echo "self_healed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Read current count from repo variable (default 0 if not set)
          FAILS=$(gh variable get "$FAILS_VAR" --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "0")
          [[ "$FAILS" =~ ^[0-9]+$ ]] || FAILS=0

          if [ "$HEALTHY" = "true" ] || [ "$RECOVERED" = "true" ]; then
            FAILS=0
          else
            FAILS=$((FAILS + 1))
          fi

          # Write back. A configured-but-failing PAT (expired or under-scoped) is
          # worse than an absent one: the count would silently reset every run and
          # never reach the alert threshold, so the monitor would sit broken and
          # quiet. Flag it (persist_broken) so the next step alerts on the
          # monitor's OWN failure. (The absent-PAT case above stays quiet: that is
          # the not-yet-enabled state, not a breakage.)
          if ! gh variable set "$FAILS_VAR" --repo "$GITHUB_REPOSITORY" --body "$FAILS"; then
            echo "::warning::failed to persist $FAILS_VAR (check RW_HEALTH_VARS_TOKEN has Variables: read/write)"
            echo "persist_broken=true" >> "$GITHUB_OUTPUT"
          fi

          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"

          if [ "$FAILS" -ge 2 ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$HEALTHY" = "false" ] && [ "$RECOVERED" = "true" ]; then
            echo "self_healed=true" >> "$GITHUB_OUTPUT"
          else
            echo "self_healed=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Alert to Slack only when auto-recovery failed twice in a row ---

      - name: Alert to Slack
        if: steps.counts.outputs.alert == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          ENV_NAME: ${{ matrix.env.name }}
          FAILS: ${{ steps.counts.outputs.fails }}
          STATUS_PAYLOAD: ${{ steps.recover.outputs.payload || steps.check.outputs.payload }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_ALERTS secret not configured, skipping alert"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$ENV_NAME" \
            --arg fails "$FAILS" \
            --arg status "$STATUS_PAYLOAD" \
            --arg run_url "$RUN_URL" \
            '{
              text: ":rotating_light: ReportWatcher *\($env)* unhealthy (\($fails) consecutive failures, auto-restart failed)",
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ":rotating_light: *ReportWatcher health check failing*\n*Environment:* \($env)\n*Consecutive failures:* \($fails) (including auto-restart attempts)\n*Status:* `\($status)`"}},
                {type: "context", elements: [{type: "mrkdwn", text: "<\($run_url)|View workflow run>"}]}
              ]
            }')
          curl -sf --max-time 10 -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      # --- Alert when the monitor itself cannot persist state (fail loud) ---
      # A configured-but-failing PAT would otherwise leave the check silently
      # unable to count failures, so the monitor could sit broken and quiet.
      # A health check that cannot report its own breakage is worse than none.

      - name: Alert monitor failure
        if: steps.counts.outputs.persist_broken == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          ENV_NAME: ${{ matrix.env.name }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_ALERTS not configured; cannot alert on monitor failure"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$ENV_NAME" \
            --arg run_url "$RUN_URL" \
            '{
              text: ":warning: ReportWatcher health monitor is broken for *\($env)* (cannot persist failure count)",
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ":warning: *ReportWatcher health monitor cannot persist state*\n*Environment:* \($env)\nRW_HEALTH_VARS_TOKEN is missing, expired, or lacks Variables: read/write, so consecutive failures cannot be counted and outage alerts will not fire. *ReportWatcher \($env) is effectively unmonitored until this is fixed.*"}},
                {type: "context", elements: [{type: "mrkdwn", text: "<\($run_url)|View workflow run>"}]}
              ]
            }')
          curl -sf --max-time 10 -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      # --- Quiet log when self-healing worked (no alert, just visibility) ---

      - name: Log self-healing
        if: steps.counts.outputs.self_healed == 'true'
        run: |
          echo "::notice::ReportWatcher ${{ matrix.env.name }} was unhealthy but recovered after auto-restart"
